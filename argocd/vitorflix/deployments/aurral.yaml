apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: aurral
  name: aurral
  namespace: vitorflix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aurral
  template:
    metadata:
      labels:
        app: aurral
    spec:
      initContainers:
      - name: init-aurral-dirs
        image: busybox:1.36
        command: ["/bin/sh", "-c"]
        args:
        - |
          mkdir -p /data/downloads/aurral &&
          chown -R "${PUID:-1000}:${PGID:-1000}" /data/downloads/aurral
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        volumeMounts:
        - mountPath: /data
          name: data
      containers:
      - image: ghcr.io/lklynet/aurral:latest
        name: aurral
        envFrom:
        - secretRef:
            name: aurral-secret-env
        env:
        - name: DOWNLOAD_FOLDER
          value: "/data/downloads/aurral"
        volumeMounts:
        - mountPath: /data
          name: data
        - mountPath: /app/backend/data
          name: config-aurral
        ports:
        - containerPort: 3001
      volumes:
      - persistentVolumeClaim:
          claimName: data
        name: data
      - persistentVolumeClaim:
          claimName: config-aurral
        name: config-aurral