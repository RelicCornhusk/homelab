apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: navidrome
  name: navidrome
  namespace: vitorflix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: navidrome
  template:
    metadata:
      labels:
        app: navidrome
    spec:
      containers:
      - image: ghcr.io/navidrome/navidrome:0.63.2
        name: navidrome
        envFrom:
        - secretRef:
            name: navidrome-secret-env
        env:
        - name: ND_MUSICFOLDER
          value: "/music/media/music"
        volumeMounts:
        - mountPath: /music
          name: data
        - mountPath: /data
          name: config-navidrome
        ports:
        - containerPort: 4533
      volumes:
      - persistentVolumeClaim:
          claimName: data
        name: data
      - persistentVolumeClaim:
          claimName: config-navidrome
        name: config-navidrome