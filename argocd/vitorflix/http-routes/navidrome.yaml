apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lidarr
  namespace: vitorflix
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: gateway
  hostnames:
    - "navidrome.vitorflix.club"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: navidrome
          port: 4533