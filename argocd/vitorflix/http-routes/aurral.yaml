apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: aurral
  namespace: vitorflix
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: gateway
  hostnames:
    - "add.music.vitorflix.club"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: aurral
          port: 3001